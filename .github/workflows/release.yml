name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check tag matches package version
        shell: bash
        run: grep -q "__version__ = \"${{ steps.version.outputs.version }}\"" src/unmeta/__init__.py
      - run: pip install -e ".[dev,build]"
      - run: pytest -q
      - run: python packaging/windows/fetch_scrcpy.py
      - run: pyinstaller packaging/windows/unmeta.spec --noconfirm
      - name: Smoke test the executable
        run: dist\unmeta\unmeta.exe --version
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\unmeta\* -DestinationPath "dist\UnMeta-Screenshare-${{ steps.version.outputs.version }}-windows-portable.zip"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*

  publish:
    needs: [windows, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
